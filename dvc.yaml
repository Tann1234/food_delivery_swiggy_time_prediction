stages:
  data_cleaning:
    cmd: python src/data/data_cleaning.py
    deps:
    - data/raw/swiggy.csv
    - src/data/data_cleaning.py
    outs:
    - data/cleaned/swiggy_cleaned.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    params:
    - data_preprocessing.test_size
    - data_preprocessing.random_state
    deps:
    - data/cleaned/swiggy_cleaned.csv
    - src/data/data_preprocessing.py
    outs:
    - data/interim/train.csv
    - data/interim/test.csv

  data_data_preprocesor:
    cmd: python src/features/data_preprocesor.py
    deps:
    - data/interim/train.csv
    - data/interim/test.csv
    - src/features/data_preprocesor.py
    outs:
    - data/processed/train_trans.csv
    - data/processed/test_trans.csv
    - models/preprocessor.joblib

  train:
    cmd: python src/model/train.py
    deps:
    - src/model/train.py
    - data/processed/train_trans.csv
    params:
    - Train.Random_Forest
    - Train.LightGBM
    outs:
    - models/model.joblib
    - models/power_transformer.joblib
    - models/stacking_regressor.joblib

  evaluation:
    cmd: python src/model/evaluation.py
    deps:
    - src/model/evaluation.py
    - models/model.joblib
    - data/processed/train_trans.csv
    - data/processed/test_trans.csv
    
    outs:
    - run_information.json
    always_changed: true

  model_registory:
    cmd: python src/model/register_model.py
    deps:
    - src/model/register_model.py
    - run_information.json